<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100" height="100">
  <!-- Main Circle -->
  <circle cx="250" cy="250" r="200" stroke="#ffffff" stroke-width="4" fill="none" />
  
  <!-- Central Node -->
  <circle cx="250" cy="250" r="20" fill="#ffffff" />
  
  <!-- Upper Node -->
  <circle cx="250" cy="150" r="15" fill="#ffffff" />
  <line x1="250" y1="170" x2="250" y2="230" stroke="#ffffff" stroke-width="4" />
  
  <!-- Lower Node -->
  <circle cx="250" cy="350" r="15" fill="#ffffff" />
  <line x1="250" y1="270" x2="250" y2="335" stroke="#ffffff" stroke-width="4" />
  
  <!-- Left Branch -->
  <line x1="250" y1="250" x2="150" y2="250" stroke="#ffffff" stroke-width="4" />
  
  <!-- Left Node -->
  <circle cx="150" cy="250" r="15" fill="#ffffff" />
  
  <!-- Left Upper Branch -->
  <line x1="150" y1="250" x2="100" y2="200" stroke="#ffffff" stroke-width="4" />
  <circle cx="100" cy="200" r="10" fill="#ffffff" />
  
  <!-- Left Lower Branch -->
  <line x1="150" y1="250" x2="100" y2="300" stroke="#ffffff" stroke-width="4" />
  <circle cx="100" cy="300" r="10" fill="#ffffff" />
  
  <!-- Left Upper Sub-Branch -->
  <line x1="100" y1="200" x2="70" y2="170" stroke="#ffffff" stroke-width="3" />
  <circle cx="70" cy="170" r="8" fill="#ffffff" />
  
  <!-- Left Lower Sub-Branch -->
  <line x1="100" y1="300" x2="70" y2="330" stroke="#ffffff" stroke-width="3" />
  <circle cx="70" cy="330" r="8" fill="#ffffff" />
  
  <!-- Right Branch -->
  <line x1="250" y1="250" x2="350" y2="250" stroke="#ffffff" stroke-width="4" />
  
  <!-- Right Node -->
  <circle cx="350" cy="250" r="15" fill="#ffffff" />
  
  <!-- Right Upper Branch -->
  <line x1="350" y1="250" x2="400" y2="200" stroke="#ffffff" stroke-width="4" />
  <circle cx="400" cy="200" r="10" fill="#ffffff" />
  
  <!-- Right Lower Branch -->
  <line x1="350" y1="250" x2="400" y2="300" stroke="#ffffff" stroke-width="4" />
  <circle cx="400" cy="300" r="10" fill="#ffffff" />
  
  <!-- Right Upper Sub-Branch -->
  <line x1="400" y1="200" x2="430" y2="170" stroke="#ffffff" stroke-width="3" />
  <circle cx="430" cy="170" r="8" fill="#ffffff" />
  
  <!-- Right Lower Sub-Branch -->
  <line x1="400" y1="300" x2="430" y2="330" stroke="#ffffff" stroke-width="3" />
  <circle cx="430" cy="330" r="8" fill="#ffffff" />
  
  <!-- Glowing Effect -->
  <circle cx="250" cy="150" r="5" fill="#69f0ff" opacity="0.8" />
  <circle cx="250" cy="350" r="5" fill="#69f0ff" opacity="0.8" />
  <circle cx="430" cy="170" r="5" fill="#69f0ff" opacity="0.8" />
  <circle cx="430" cy="330" r="5" fill="#69f0ff" opacity="0.8" />
  <circle cx="70" cy="170" r="5" fill="#69f0ff" opacity="0.8" />
  <circle cx="70" cy="330" r="5" fill="#69f0ff" opacity="0.8" />
  
  <!-- Top Arc Nodes -->
  <circle cx="175" cy="158" r="5" fill="#69f0ff" opacity="0.8" />
  <circle cx="325" cy="158" r="5" fill="#69f0ff" opacity="0.8" />
  
  <!-- Bottom Arc Node -->
  <circle cx="250" cy="420" r="5" fill="#69f0ff" opacity="0.8" />
</svg>
